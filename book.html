<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Book a Pickup — Sonoma Resort</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #000;
    color: #fff;
    max-width: 560px;
    margin: 0 auto;
    padding: 16px 16px 48px;
    -webkit-tap-highlight-color: transparent;
  }
  h1 { font-size: 28px; margin: 8px 0 2px; }
  .sub { color: #a3a3a3; font-size: 14px; margin-bottom: 16px; }
  .card {
    background: #111;
    border: 1px solid #16a34a;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
  }
  label { display: block; font-size: 13px; font-weight: 600; color: #d4d4d4; margin: 10px 0 4px; }
  input, textarea {
    width: 100%;
    font-size: 17px;
    padding: 12px;
    border: 2px solid #333;
    border-radius: 12px;
    background: #111;
    color: #fff;
  }
  input:focus, textarea:focus { outline: none; border-color: #16a34a; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row2 > div { min-width: 0; }
  @media (max-width: 480px) {
    .row2 { grid-template-columns: 1fr; }
  }
  .btn {
    display: block;
    width: 100%;
    font-size: 17px;
    font-weight: 700;
    padding: 14px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    margin-top: 14px;
    text-align: center;
  }
  .btn-green { background: #16a34a; color: #fff; }
  .btn-white { background: #111; border: 2px solid #16a34a; color: #fff; }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; }
  .price-line { font-size: 16px; padding: 4px 0; }
  .price-line b { float: right; }
  .warn {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 12px;
    background: #450a0a;
    border: 1px solid #dc2626;
    color: #fff;
    font-size: 14px;
    display: none;
  }
  .warn.show { display: block; }
  .spot-line { font-size: 14px; color: #4ade80; margin-top: 8px; font-weight: 700; }
  .spot-line.not-picked { color: #a3a3a3; font-weight: 400; }
  #map { height: 320px; border-radius: 14px; border: 2px solid #16a34a; }
  .pick-dot {
    background: #16a34a;
    border: 3px solid #fff;
    border-radius: 50%;
    box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.45);
  }
  .map-label {
    background: #111;
    color: #fff;
    border: 1px solid #16a34a;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 8px;
    box-shadow: none;
  }
  .map-label::before { display: none; }
  .leaflet-container { font-family: inherit; background: #111; }
  .small { font-size: 13px; color: #a3a3a3; margin-top: 8px; line-height: 1.4; }
  .ok-big { font-size: 52px; text-align: center; margin: 12px 0 4px; }
  .sum-line { font-size: 16px; padding: 5px 0; }
  .sum-line b { float: right; }
  .view { display: none; }
  .view.active { display: block; }
</style>
</head>
<body>

<!-- ============ BOOKING FORM ============ -->
<div id="view-form" class="view active">
  <h1>📍 Book a pickup</h1>
  <p class="sub">Sonoma Resort Apartments, Aurora — pick a spot on the map, choose a day and time, then book.</p>

  <div class="card">
    <div class="price-line">1 pack<b>$30</b></div>
    <div class="price-line">2 packs<b>$55</b></div>
    <div class="price-line">3 packs<b>$80</b></div>
    <div class="price-line">4 packs<b>$105</b></div>
  </div>

  <div class="card">
    <label style="margin-top:0">Where should we meet? Tap the map to drop your dot</label>
    <div id="map"></div>
    <div class="spot-line not-picked" id="spot-line">No spot picked yet — tap the map inside Sonoma Resort.</div>
  </div>

  <div class="card">
    <label for="cust-name" style="margin-top:0">Your name</label>
    <input id="cust-name" type="text" placeholder="Your name" autocomplete="off">

    <label for="cust-phone">Phone number</label>
    <input id="cust-phone" type="tel" placeholder="So we can reach you" autocomplete="off">

    <label for="cust-item">What do you want to buy?</label>
    <input id="cust-item" type="text" placeholder="e.g. 2 packs of Goldfish" autocomplete="off">

    <div class="row2">
      <div>
        <label for="cust-date">Day</label>
        <input id="cust-date" type="date">
      </div>
      <div>
        <label for="cust-time">Time</label>
        <input id="cust-time" type="time">
      </div>
    </div>

    <div class="warn" id="book-warn"></div>
    <button class="btn btn-green" id="book-btn" type="button">📅 Book it</button>
  </div>
</div>

<!-- ============ BOOKED! ============ -->
<div id="view-done" class="view">
  <div class="ok-big">✅</div>
  <h1 style="text-align:center">You're booked!</h1>
  <p class="sub" style="text-align:center">Your booking has been sent.</p>
  <div class="card" id="done-summary"></div>
  <button class="btn btn-white" id="book-another" type="button">Book another pickup</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
"use strict";

/* Sonoma Resort at Saddle Rock, 22159 E Ontario Dr, Aurora, CO 80016 */
var COMPLEX_LAT = 39.59442;
var COMPLEX_LNG = -104.72963;

var firebaseConfig = {
  apiKey: "AIzaSyCX9Alnfs1LpwuaEmnagCWQc-9QYqaycYE",
  authDomain: "sales-tracker-575a8.firebaseapp.com",
  projectId: "sales-tracker-575a8",
  storageBucket: "sales-tracker-575a8.firebasestorage.app",
  messagingSenderId: "405558986151",
  appId: "1:405558986151:web:86ecf6ad05d5cf38b8e282"
};
var db = null;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  firebase.auth().signInAnonymously().catch(function () {});
} catch (e) {}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function fmtDate(dateStr) {
  var parts = dateStr.split("-").map(Number);
  var d = new Date(parts[0], parts[1] - 1, parts[2]);
  return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
}
function fmtTime(t) {
  var p = t.split(":");
  var h = +p[0], m = p[1];
  var ap = h >= 12 ? "PM" : "AM";
  h = h % 12; if (h === 0) h = 12;
  return h + ":" + m + " " + ap;
}

/* ---------- map ---------- */
var picked = null; /* {lat, lng} */
var marker = null;
var COMPLEX_BOUNDS = L.latLngBounds([39.5920, -104.7355], [39.5965, -104.7265]);
var map = L.map("map", { scrollWheelZoom: false, minZoom: 17, maxZoom: 19, maxBounds: COMPLEX_BOUNDS, maxBoundsViscosity: 1.0 }).setView([COMPLEX_LAT, COMPLEX_LNG], 17);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);
L.circle([COMPLEX_LAT, COMPLEX_LNG], {
  radius: 350, color: "#16a34a", weight: 2, fillColor: "#16a34a", fillOpacity: 0.07
}).addTo(map).bindTooltip("Sonoma Resort Apartments", {
  permanent: true, direction: "top", className: "map-label"
});

var dotIcon = L.divIcon({ className: "pick-dot", iconSize: [22, 22], iconAnchor: [11, 11] });
function setSpot(latlng) {
  picked = { lat: Math.round(latlng.lat * 100000) / 100000, lng: Math.round(latlng.lng * 100000) / 100000 };
  if (marker) {
    marker.setLatLng(latlng);
  } else {
    marker = L.marker(latlng, { icon: dotIcon, draggable: true }).addTo(map);
    marker.on("dragend", function () { setSpot(marker.getLatLng()); });
  }
  var el = document.getElementById("spot-line");
  el.textContent = "📍 Spot picked — tap the map or drag the dot to move it.";
  el.classList.remove("not-picked");
}
map.on("click", function (e) { setSpot(e.latlng); });

/* ---------- form ---------- */
var dateInput = document.getElementById("cust-date");
var today = new Date();
dateInput.min = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, "0") + "-" + String(today.getDate()).padStart(2, "0");

function showWarn(msg) {
  var w = document.getElementById("book-warn");
  w.textContent = msg;
  w.classList.add("show");
}
function book() {
  var name = document.getElementById("cust-name").value.trim();
  var phone = document.getElementById("cust-phone").value.trim();
  var item = document.getElementById("cust-item").value.trim();
  var date = dateInput.value;
  var time = document.getElementById("cust-time").value;
  if (!name) { showWarn("Add your name first."); return; }
  if (!phone) { showWarn("Add your phone number so we can reach you."); return; }
  if (!item) { showWarn("Say what you want to buy."); return; }
  if (!date) { showWarn("Pick a day."); return; }
  if (!time) { showWarn("Pick a time."); return; }
  if (!picked) { showWarn("Tap the map to drop your dot where you'll meet."); return; }
  if (!db) { showWarn("Couldn't reach the booking service — check your connection and try again."); return; }

  var btn = document.getElementById("book-btn");
  btn.disabled = true;
  btn.textContent = "Booking…";
  db.collection("bookings").add({
    name: name,
    phone: phone,
    item: item,
    date: date,
    time: time,
    lat: picked.lat,
    lng: picked.lng,
    status: "new",
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function () {
    document.getElementById("done-summary").innerHTML =
      '<div class="sum-line">Name<b>' + esc(name) + '</b></div>'
      + '<div class="sum-line">Buying<b>' + esc(item) + '</b></div>'
      + '<div class="sum-line">When<b>' + fmtDate(date) + ' at ' + fmtTime(time) + '</b></div>'
      + '<div class="sum-line">Spot<b>Sonoma Resort</b></div>';
    document.getElementById("view-form").classList.remove("active");
    document.getElementById("view-done").classList.add("active");
    window.scrollTo(0, 0);
  }).catch(function () {
    showWarn("Couldn't send the booking — check your connection and try again.");
    btn.disabled = false;
    btn.textContent = "📅 Book it";
  });
}
document.getElementById("book-btn").addEventListener("click", book);
document.getElementById("book-another").addEventListener("click", function () {
  document.getElementById("cust-name").value = "";
  document.getElementById("cust-phone").value = "";
  document.getElementById("cust-item").value = "";
  dateInput.value = "";
  document.getElementById("cust-time").value = "";
  if (marker) { map.removeLayer(marker); marker = null; }
  picked = null;
  var el = document.getElementById("spot-line");
  el.textContent = "No spot picked yet — tap the map inside Sonoma Resort.";
  el.classList.add("not-picked");
  var btn = document.getElementById("book-btn");
  btn.disabled = false;
  btn.textContent = "📅 Book it";
  document.getElementById("view-done").classList.remove("active");
  document.getElementById("view-form").classList.add("active");
  window.scrollTo(0, 0);
});
</script>
</body>
</html>
